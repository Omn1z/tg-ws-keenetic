name: Rust checks and router releases

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      arch:
        description: Router architecture to build (release tags always build all)
        type: choice
        default: all
        options: [all, mips, mipsel, arm, armv7, aarch64, x86_64]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CROSS_REVISION: 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # Target build jobs independently compile and test vendored static TLS.
      OPENSSL_NO_VENDOR: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and shell tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y shellcheck pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check and test
        run: |
          cargo +1.97.0 fmt --all -- --check
          cargo +1.97.0 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.0 test --locked
          cargo +1.97.0 test --locked --no-default-features
          shellcheck -S warning scripts/install.sh scripts/uninstall.sh scripts/test-installer.sh scripts/update-worker.sh scripts/test-update-worker.sh scripts/build-release.sh etc/init.d/S99tgwsproxy
          sh scripts/test-installer.sh
          sh scripts/test-update-worker.sh
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$TAG" = "v$version" || { echo "Tag $TAG differs from Cargo version $version"; exit 1; }

  build:
    needs: check
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && inputs.arch != 'all' && format('["{0}"]', inputs.arch) || '["mips","mipsel","arm","armv7","aarch64","x86_64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native ARM64 musl build tools
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential perl jq binutils file
          rustup toolchain install 1.97.0 --profile minimal --target aarch64-unknown-linux-musl
      - name: Install pinned cross and Rust source
        if: matrix.arch != 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          rustup toolchain install 1.97.0 --profile minimal
          rustup toolchain install nightly-2026-09-01 --profile minimal --component rust-src
          cargo +1.97.0 install cross --git https://github.com/cross-rs/cross --rev "$CROSS_REVISION" --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: router-${{ matrix.arch }}
      - name: Build, verify static ELF, and run target startup checks
        run: bash scripts/build-release.sh '${{ matrix.arch }}' '${{ matrix.arch == 'aarch64' && 'native' || 'cross' }}'
      - uses: actions/upload-artifact@v4
        with:
          name: router-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: router-*
          path: dist
          merge-multiple: true
      - name: Package installation entry points and checksums
        run: |
          cp scripts/install.sh scripts/uninstall.sh dist/
          cd dist
          for arch in mips mipsel arm armv7 aarch64 x86_64; do
            test -s "tgwsproxy-$arch.tar.gz"
            test -s "build-$arch.txt"
          done
          sha256sum tgwsproxy-*.tar.gz install.sh uninstall.sh build-*.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --latest --title "$TAG" --generate-notes
