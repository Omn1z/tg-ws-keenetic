# MIPS has no distributed rust-std: build it with pinned nightly + rust-src.
# Use the current cross toolchain images; each CI job records its resolved digest.
[build.env]
passthrough = ["RUSTFLAGS", "SOURCE_DATE_EPOCH", "TGWS_ARCH", "QEMU_CPU"]

[target.mips-unknown-linux-musl]
image = "ghcr.io/cross-rs/mips-unknown-linux-musl:main"
build-std = ["std", "panic_abort"]
# Tier-3 std has no bundled libunwind. The cross GCC toolchain supplies the
# compatible GNU unwinder as libgcc_eh.a; expose it under Rust's requested name.
pre-build = [
    "unwinder=$(mips-linux-muslsf-gcc -print-file-name=libgcc_eh.a) && test -f \"$unwinder\" && cp \"$unwinder\" \"$(dirname \"$unwinder\")/libunwind.a\"",
]

[target.mipsel-unknown-linux-musl]
image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:main"
build-std = ["std", "panic_abort"]
pre-build = [
    "unwinder=$(mipsel-linux-muslsf-gcc -print-file-name=libgcc_eh.a) && test -f \"$unwinder\" && cp \"$unwinder\" \"$(dirname \"$unwinder\")/libunwind.a\"",
]

[target.armv5te-unknown-linux-musleabi]
image = "ghcr.io/cross-rs/armv5te-unknown-linux-musleabi:main"

[target.armv7-unknown-linux-musleabi]
image = "ghcr.io/cross-rs/armv7-unknown-linux-musleabi:main"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"
